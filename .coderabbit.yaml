# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: ko-KR
tone_instructions: "해커톤 팀원(입문 개발자)에게 말하듯 짧고 쉬운 한국어로, 고쳐야 하는 이유를 한 줄로 설명해줘."
reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  high_level_summary_in_walkthrough: true
  enable_prompt_for_ai_agents: false
  poem: false
  in_progress_fortune: false
  sequence_diagrams: false
  estimate_code_review_effort: false
  suggested_reviewers: false
  auto_assign_reviewers: false
  review_status: true
  fail_commit_status: false
  auto_review:
    enabled: true
    drafts: false
    base_branches: [main]
  finishing_touches:
    docstrings:
      enabled: false
    unit_tests:
      enabled: false
    simplify:
      enabled: false
    autofix:
      enabled: false
    fix_ci:
      enabled: false
    resolve_merge_conflict:
      enabled: false
  path_filters:
    - "!**/build/**"
    - "!**/.gradle/**"
  path_instructions:
    - path: "src/main/java/**"
      instructions: |
        - API 요청·응답 필드 이름, 타입, 단위(금액은 만원 단위 정수)가 docs/03-api-contract.md와 같은지 확인해줘.
        - 위험 점수와 등급 계산은 docs/01-registry-questions.md 2~3절 규칙과 같은지 확인해줘. UNKNOWN 답은 위험한 답으로 계산해야 해.
        - 에러 응답은 docs/03의 {"error": {"code", "message", "field"}} 형식이어야 해.
        - 비밀번호, API 키가 코드에 하드코딩되어 있으면 지적해줘.
        - 해커톤 프로토타입이라 과한 추상화나 범위 밖 기능(로그인, OCR 등)을 제안하지 마.
    - path: "db/**"
      instructions: "테이블과 컬럼 이름이 docs/04-db-schema.md와 같은지 확인해줘."
    - path: "docs/**"
      instructions: "문서끼리(01~07) 코드 이름, 필드 이름, 점수가 서로 어긋나지 않는지만 확인해줘."
chat:
  auto_reply: true
