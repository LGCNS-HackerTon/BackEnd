spring:
  application:
    name: jeonse
  config:
    # 저장소 루트의 .env를 properties 형식으로 읽는다. 파일이 없으면 환경 변수만 사용한다.
    import: optional:file:./.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:h2:mem:jeonse;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  jackson:
    deserialization:
      # 금액에 소수(24000.5)가 오면 잘라 쓰지 않고 400으로 돌려준다 (docs/03 2절)
      accept-float-as-int: false
  h2:
    console:
      enabled: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 21MB
      file-size-threshold: 10MB # 서류를 임시 파일로 쓰지 않고 메모리에만 둔다 (NFR-06)

clova:
  ocr:
    url: ${CLOVA_OCR_URL:}
    secret: ${CLOVA_OCR_SECRET:}

# 진단 결과 쉬운 말 설명 (docs/08 AI). 키가 없으면 템플릿 문장을 쓴다
anthropic:
  api-key: ${ANTHROPIC_API_KEY:}
  model: ${ANTHROPIC_MODEL:claude-opus-5-5}

jwt:
  # 비우면 서버 시작 때 임시 키를 만든다 (재시작하면 기존 토큰 무효). 32바이트 이상
  secret: ${JWT_SECRET:}

demo:
  # 서버 시작 때 데모 회원(demo@example.com)이 없으면 이 비밀번호로 만든다 (FE "데모 계정으로 시작")
  password: ${DEMO_PASSWORD:jeonse-demo-2026}

server:
  port: 8080

logging:
  level:
    org.springframework.http.converter: INFO
    org.springframework.web.client: INFO
